{ "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- palette (tokens from aesthetics.md) ----------
const C = {
  bg: 0x0b0805, matter: 0x17120d, amber: 0xffb000, dim: 0x6b4a1a,
  cyan: 0x3ef2d0, white: 0xf2e8d5, coral: 0xff5a4f, moss: 0x2b2614,
};
const V = THREE.Vector3;

// Seeded randomness: the same seed always grows the same plant.
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20261005);
const rr = (a, b) => a + (b - a) * rand();
const pick = (arr) => arr[Math.floor(rand() * arr.length)];

// ---------- renderer, scene, camera ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.bg);
scene.fog = new THREE.FogExp2(C.bg, 0.035);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 3.6, 15.8);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 3.0, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;
controls.minDistance = 7; controls.maxDistance = 22;
controls.minPolarAngle = 0.9; controls.maxPolarAngle = 1.75;

scene.add(new THREE.AmbientLight(0x3a2814, 0.55));
const key = new THREE.DirectionalLight(0xffd9a0, 0.35); key.position.set(3, 8, 6); scene.add(key);
const back = new THREE.DirectionalLight(C.dim, 1.4); back.position.set(-2, 5, -8); scene.add(back);
const glowLight = new THREE.PointLight(C.amber, 3, 7, 2); glowLight.position.set(0, 2.6, 0.3); scene.add(glowLight);
const cyanLight = new THREE.PointLight(C.cyan, 3, 4, 2); cyanLight.position.set(0.8, 4.8, 0.6); scene.add(cyanLight);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// ---------- jar geometry limits ----------
const JAR_R = 2.0, FLOOR = 0.62, WALL_TOP = 4.4;
function clampInJar(p) {
  p.y = THREE.MathUtils.clamp(p.y, FLOOR + 0.12, WALL_TOP + JAR_R - 0.35);
  let max = JAR_R - 0.28;
  if (p.y > WALL_TOP) max = Math.sqrt(Math.max(0.01, JAR_R * JAR_R - (p.y - WALL_TOP) ** 2)) - 0.3;
  const r = Math.hypot(p.x, p.z);
  if (r > max) { p.x *= max / r; p.z *= max / r; }
  return p;
}

// ---------- materials ----------
function rimMaterial(color, rim, strength, opts = {}) {
  const m = new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.15, ...opts });
  m.onBeforeCompile = (sh) => {
    sh.uniforms.rimColor = { value: new THREE.Color(rim) };
    sh.uniforms.rimStrength = { value: strength };
    sh.fragmentShader = 'uniform vec3 rimColor;\nuniform float rimStrength;\n' + sh.fragmentShader.replace(
      '#include <emissivemap_fragment>',
      '#include <emissivemap_fragment>\n totalEmissiveRadiance += rimColor * pow(1.0 - abs(dot(normal, normalize(vViewPosition))), 3.0) * rimStrength;');
  };
  return m;
}
const vineMat = rimMaterial(0x2a1f14, 0x8a6228, 1.4);
const mainVineMat = rimMaterial(0x2c2015, C.amber, 0.45);
const staleMat = rimMaterial(0x15110c, 0x3a2a12, 0.9, { roughness: 0.9 });
const rockMat = rimMaterial(0x15100b, 0x2a1d0e, 0.6, { roughness: 0.95, metalness: 0 });
const glow = (hex, k = 1) => new THREE.Color(hex).multiplyScalar(k);

// ---------- tapered tube ----------
function taperTube(curve, segs, radial, rFn) {
  const frames = curve.computeFrenetFrames(segs, false);
  const pos = [], nor = [], idx = [];
  const P = new V(), n = new V();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs; curve.getPointAt(t, P);
    const N = frames.normals[i], B = frames.binormals[i], r = rFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2;
      n.set(0, 0, 0).addScaledVector(N, Math.cos(a)).addScaledVector(B, Math.sin(a)).normalize();
      pos.push(P.x + n.x * r, P.y + n.y * r, P.z + n.z * r); nor.push(n.x, n.y, n.z);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) {
    const a = i * (radial + 1) + j, b = a + radial + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setIndex(idx);
  return { geometry: g, frames };
}

// ---------- plinth with radial activity chart ----------
const activity = Array.from({ length: 72 }, (_, i) => {
  const burst = Math.max(0, Math.sin(i * 0.37) * Math.sin(i * 0.11 + 1)) * 0.6;
  const recent = i > 55 ? (i - 55) / 17 * 0.5 : 0;
  return Math.min(1, 0.08 + rand() * 0.25 + burst + recent);
});
{
  const plinth = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.62, 0.56, 128), rimMaterial(0x110d09, 0x2a1d0e, 0.5, { roughness: 0.85 }));
  plinth.position.y = 0.28; scene.add(plinth);
  const soil = new THREE.Mesh(new THREE.CylinderGeometry(JAR_R, JAR_R, 0.08, 96), new THREE.MeshStandardMaterial({ color: 0x0d0a07, roughness: 1 }));
  soil.position.y = 0.6; scene.add(soil);
  const ringMat = new THREE.MeshBasicMaterial({ color: glow(C.dim, 1.2) });
  for (const y of [0.12, 0.44]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(2.55 - y * 0.2, 0.005, 6, 256), ringMat);
    ring.rotation.x = Math.PI / 2; ring.position.y = y; scene.add(ring);
  }
  const jarRing = new THREE.Mesh(new THREE.TorusGeometry(JAR_R + 0.02, 0.012, 8, 200), new THREE.MeshBasicMaterial({ color: glow(C.dim, 1.6) }));
  jarRing.rotation.x = Math.PI / 2; jarRing.position.y = 0.58; scene.add(jarRing);

  // tick marks on the plinth side
  const ticks = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), ringMat, 144);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new V();
  for (let i = 0; i < 144; i++) {
    const a = i / 144 * Math.PI * 2, long = i % 12 === 0;
    q.setFromAxisAngle(new V(0, 1, 0), -a);
    s.set(0.006, long ? 0.14 : 0.06, 0.006);
    m.compose(new V(Math.cos(a) * 2.565, 0.28, Math.sin(a) * 2.565), q, s);
    ticks.setMatrixAt(i, m);
  }
  scene.add(ticks);

  // radial bar chart: one bar per day, the plinth is the chart
  const n = activity.length;
  const bars = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshStandardMaterial({ color: 0x1d160e, roughness: 0.7 }), n);
  const caps = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), n);
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2 + Math.PI / 2, h = 0.04 + activity[i] * 0.42;
    q.setFromAxisAngle(new V(0, 1, 0), -a);
    const x = Math.cos(a) * 2.27, z = Math.sin(a) * 2.27;
    m.compose(new V(x, 0.56 + h / 2, z), q, s.set(0.1, h, 0.04)); bars.setMatrixAt(i, m);
    m.compose(new V(x, 0.56 + h + 0.008, z), q, s.set(0.1, 0.016, 0.045)); caps.setMatrixAt(i, m);
    caps.setColorAt(i, i > n - 15 ? glow(C.amber, 1.1) : glow(C.dim, 1.2));
  }
  scene.add(bars, caps);
}

// ---------- rocks and moss ----------
const mossSpots = [];
function rockGeometry(r) {
  const g = new THREE.IcosahedronGeometry(r, 5);
  const p = g.attributes.position, v = new V(), sd = rand() * 10;
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const k = 1 + 0.16 * Math.sin(v.x * 5 / r + sd) * Math.sin(v.y * 6 / r + sd * 2) * Math.sin(v.z * 4 / r + sd * 3)
      + 0.06 * Math.sin((v.x * 13 + v.z * 11) / r + sd);
    v.multiplyScalar(k); v.y *= 0.55; p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
for (const [x, z, r] of [[0.15, 0.05, 0.62], [-1.05, 0.55, 0.45], [1.05, -0.55, 0.5], [-0.5, -1.0, 0.36], [0.9, 0.95, 0.3], [-1.3, -0.35, 0.28], [1.45, 0.25, 0.22]]) {
  const geo = rockGeometry(r);
  const rock = new THREE.Mesh(geo, rockMat);
  rock.position.set(x, FLOOR + r * 0.12, z); rock.rotation.y = rand() * 6; scene.add(rock);
  rock.updateMatrixWorld();
  const p = geo.attributes.position, nrm = geo.attributes.normal, nm = new THREE.Matrix3().getNormalMatrix(rock.matrixWorld);
  for (let i = 0; i < p.count; i += 2) {
    const nv = new V().fromBufferAttribute(nrm, i).applyMatrix3(nm).normalize();
    if (nv.y > 0.25 && rand() < 0.55) mossSpots.push({ p: new V().fromBufferAttribute(p, i).applyMatrix4(rock.matrixWorld), n: nv });
  }
}
for (let i = 0; i < 500; i++) {
  const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * (JAR_R - 0.1);
  mossSpots.push({ p: new V(Math.cos(a) * r, FLOOR + 0.04, Math.sin(a) * r), n: new V(0, 1, 0) });
}

// ---------- the vine network (synthetic repo) ----------
const mainPts = [];
for (let k = 0; k <= 48; k++) {
  const s = k / 48, a = s * Math.PI * 2 * 2.1;
  const rad = 0.3 + 0.22 * Math.sin(s * 6.5) * (1 - s * 0.3);
  mainPts.push(new V(Math.cos(a) * rad + 0.15, FLOOR + 0.25 + s * 5.25, Math.sin(a) * rad + 0.05));
}
mainPts.unshift(new V(0.15, FLOOR - 0.05, 0.05));
const mainCurve = new THREE.CatmullRomCurve3(mainPts);
const vines = [];
function addVine(curve, kind, rFn, mat, extra = {}) {
  const segs = Math.max(40, Math.floor(curve.getLength() * 30));
  const { geometry, frames } = taperTube(curve, segs, 10, rFn);
  const mesh = new THREE.Mesh(geometry, mat); scene.add(mesh);
  const v = { curve, kind, rFn, frames, segs, ...extra }; vines.push(v); return v;
}
addVine(mainCurve, 'main', (t) => THREE.MathUtils.lerp(0.13, 0.04, t), mainVineMat, { name: 'main' });

function spiralCurve({ parent, t0, t1, R0, turns, theta0, rise = 0, merge, N = 34 }) {
  const pts = [];
  for (let k = 0; k <= N; k++) {
    const s = k / N; let base, env;
    if (merge) { base = parent.getPointAt(t0 + (t1 - t0) * s); env = Math.pow(Math.sin(Math.PI * s), 0.75) * R0; }
    else { base = parent.getPointAt(t0).clone(); base.y += rise * s; env = R0 * Math.pow(s, 0.7); }
    const a = theta0 + s * turns * Math.PI * 2;
    pts.push(clampInJar(new V(base.x + Math.cos(a) * env, base.y + Math.sin(s * 9 + theta0) * 0.07 * env, base.z + Math.sin(a) * env)));
  }
  return new THREE.CatmullRomCurve3(pts);
}

const names = ['feat/roots', 'fix/spore-04', 'feat/terminal-panel', 'feat/shared-contracts', 'chore/ci', 'feat/worktrees', 'fix/socket-auth', 'feat/mock-server', 'spike/pixi-test', 'feat/drizzle-schema'];
let merged = 0, open = 0, stale = 0;
const knots = [];
// merged branches: leave main, coil around it, grow back in
for (let b = 0; b < 11; b++) {
  const t0 = rr(0.04, 0.7), t1 = Math.min(0.97, t0 + rr(0.15, 0.35));
  const curve = spiralCurve({ parent: mainCurve, t0, t1, R0: rr(0.8, 1.7), turns: rr(0.25, 0.8) * (rand() < 0.5 ? -1 : 1), theta0: rand() * 6.28, merge: true });
  const v = addVine(curve, 'merged', (t) => 0.04 - 0.012 * Math.sin(Math.PI * t), vineMat);
  knots.push(mainCurve.getPointAt(t1)); merged++;
  // nested branch that merges back into this branch
  if (rand() < 0.45) {
    const u0 = rr(0.1, 0.5), u1 = Math.min(0.92, u0 + rr(0.2, 0.4));
    const child = spiralCurve({ parent: curve, t0: u0, t1: u1, R0: rr(0.2, 0.45), turns: rr(0.8, 1.6), theta0: rand() * 6.28, merge: true, N: 24 });
    addVine(child, 'merged', (t) => 0.022 - 0.006 * Math.sin(Math.PI * t), vineMat);
    knots.push(curve.getPointAt(u1)); merged++;
  }
}
// open branches: still growing outward, some carry an agent
const activeTips = [];
for (let b = 0; b < 7; b++) {
  const t0 = rr(0.25, 0.85);
  const curve = spiralCurve({ parent: mainCurve, t0, R0: rr(1.2, 1.75), turns: rr(0.45, 1.1) * (rand() < 0.5 ? -1 : 1), theta0: b * 0.9 + rand(), rise: rr(0.5, 1.5), merge: false });
  const v = addVine(curve, 'open', (t) => THREE.MathUtils.lerp(0.04, 0.011, t), vineMat, { name: names[b] });
  if (b < 4) activeTips.push(v);
  open++;
}
// stale branches: drooping, mossy
for (let b = 0; b < 3; b++) {
  const t0 = rr(0.12, 0.4), start = mainCurve.getPointAt(t0), a0 = rand() * 6.28, R0 = rr(0.9, 1.4), pts = [];
  for (let k = 0; k <= 24; k++) {
    const s = k / 24, a = a0 + s * 0.8;
    pts.push(clampInJar(new V(start.x + Math.cos(a) * R0 * s, start.y + 0.35 * Math.sin(Math.PI * s * 0.7) - s * s * 1.1, start.z + Math.sin(a) * R0 * s)));
  }
  const v = addVine(new THREE.CatmullRomCurve3(pts), 'stale', (t) => THREE.MathUtils.lerp(0.03, 0.014, t), staleMat, { name: b === 0 ? 'spike/pixi-test' : null });
  stale++;
}

// tendrils: small curls at tips and along vines
function tendril(P, T, size, turns) {
  const up = Math.abs(T.y) < 0.9 ? new V(0, 1, 0) : new V(1, 0, 0);
  const U = new V().crossVectors(T, up).normalize(), W = new V().crossVectors(T, U).normalize(), pts = [];
  for (let k = 0; k <= 26; k++) {
    const s = k / 26, a = s * turns * Math.PI * 2, rad = size * (1 - s * 0.8);
    pts.push(P.clone().addScaledVector(T, s * size * 1.4).addScaledVector(U, (Math.cos(a) - 1) * rad).addScaledVector(W, Math.sin(a) * rad));
  }
  const c = new THREE.CatmullRomCurve3(pts);
  scene.add(new THREE.Mesh(taperTube(c, 60, 6, (t) => THREE.MathUtils.lerp(0.009, 0.003, t)).geometry, vineMat));
}
for (const v of vines) {
  if (v.kind === 'open') tendril(v.curve.getPointAt(1), v.curve.getTangentAt(1), rr(0.1, 0.18), rr(1.6, 2.4));
  if (v.kind === 'merged' && rand() < 0.7) {
    const t = rr(0.2, 0.8), T = v.curve.getTangentAt(t), side = new V(rand() - 0.5, rand() * 0.6, rand() - 0.5).normalize();
    tendril(v.curve.getPointAt(t), side.addScaledVector(T, 0.3).normalize(), rr(0.06, 0.12), rr(1.5, 2.5));
  }
}

// ---------- commit nodes, issues, merge knots ----------
const nodeGeo = new THREE.IcosahedronGeometry(1, 2);
const nodes = new THREE.InstancedMesh(nodeGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }), 3000);
let nodeCount = 0;
const mm = new THREE.Matrix4(), qq = new THREE.Quaternion();
function addNode(p, size, color) {
  mm.compose(p, qq, new V(size, size, size)); nodes.setMatrixAt(nodeCount, mm); nodes.setColorAt(nodeCount, color); nodeCount++;
}
for (const v of vines) {
  const L = v.curve.getLength(), n = Math.floor(L / (v.kind === 'main' ? 0.2 : 0.3));
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, p = v.curve.getPointAt(t), r = v.rFn(t);
    const fi = Math.min(v.segs, Math.round(t * v.segs)), a = rand() * Math.PI * 2;
    p.addScaledVector(v.frames.normals[fi], Math.cos(a) * r * 0.75).addScaledVector(v.frames.binormals[fi], Math.sin(a) * r * 0.75);
    let col, size = rr(0.014, 0.03) + (rand() < 0.05 ? 0.02 : 0);
    if (v.kind === 'stale') { col = glow(C.dim, 1.3); size *= 0.8; }

}
const commitCount = nodeCount;
// open issues: small coral clusters on a few vines
const issueVines = vines.filter((v) => v.kind !== 'main').slice(0, 12).filter((_, i) => i % 2 === 0).slice(0, 6);
for (const v of issueVines) {
  const c = v.curve.getPointAt(rr(0.3, 0.7));
  for (let k = 0; k < 4; k++) addNode(c.clone().add(new V(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(0.05)), rr(0.02, 0.035), glow(C.coral, 1.5));
}
// merge knots: a bright bead and a ring where a branch grows back in
const knotRingGeo = new THREE.TorusGeometry(0.085, 0.008, 6, 32);
const knotRingMat = new THREE.MeshBasicMaterial({ color: glow(C.amber, 1.2) });
for (const k of knots) {
  addNode(k, 0.04, glow(C.amber, 1.8));
  const ring = new THREE.Mesh(knotRingGeo, knotRingMat); ring.position.copy(k);

}
nodes.count = nodeCount; nodes.instanceMatrix.needsUpdate = true; scene.add(nodes);

// ---------- moss ----------
{
  const spots = [...mossSpots];
  for (const v of vines.filter((x) => x.kind === 'stale')) {
    for (let i = 0; i < 160; i++) {
      const t = rr(0.05, 1), p = v.curve.getPointAt(t), fi = Math.min(v.segs, Math.round(t * v.segs)), a = rand() * 6.28;
      const n = new V().addScaledVector(v.frames.normals[fi], Math.cos(a)).addScaledVector(v.frames.binormals[fi], Math.sin(a)).normalize();

  }

  let c = 0;
  for (const sp of spots) for (let j = 0; j < 3; j++) {
    const s = rr(0.012, 0.03), p = sp.p.clone().add(new V(rr(-1, 1), rr(-0.3, 0.6), rr(-1, 1)).multiplyScalar(0.03));

}

// ---------- possible growth paths (cyan) ----------
const pathCurves = [];
for (const v of activeTips) {
  const tip = v.curve.getPointAt(1), T0 = v.curve.getTangentAt(1);
  for (let k = 0; k < 3; k++) {
    const dir = T0.clone().applyAxisAngle(new V(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(), rr(0.25, 0.9));
    const axis = new V(rand() - 0.5, rand() - 0.5, rand() - 0.5).normalize(), bend = rr(0.08, 0.2);
    const pts = [tip.clone()];
    for (let i = 0; i < 22; i++) { dir.applyAxisAngle(axis, bend); pts.push(clampInJar(pts[pts.length - 1].clone().addScaledVector(dir, 0.085))); }
    const curve = new THREE.CatmullRomCurve3(pts); pathCurves.push(curve);
    const sample = curve.getPoints(90), cols = [];
    sample.forEach((_, i) => { const f = Math.pow(1 - i / 90, 1.6) * 1.6; cols.push(0.243 * f, 0.949 * f, 0.816 * f); });
    const g = new THREE.BufferGeometry().setFromPoints(sample);

}

// ---------- particles: spores, path flow, condensation ----------
function dotTexture() {

}
const dot = dotTexture();

  const g = new THREE.BufferGeometry(), pos = new Float32Array(flow.n * 3);

}
const spores = { n: 380 };
{
  const pos = new Float32Array(spores.n * 3);

}
{
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {

  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 0.022, map: dot, color: C.white, transparent: true, opacity: 0.22, depthWrite: false })));

// ---------- mist and cloud ----------
function mistTexture() {

    g.addColorStop(0, 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128);

const mistTex = mistTexture(), mists = [];

// ---------- glass bell jar ----------
{
  const prof = [new THREE.Vector2(JAR_R + 0.05, FLOOR - 0.03), new THREE.Vector2(JAR_R, FLOOR)];
  for (let i = 0; i <= 20; i++) prof.push(new THREE.Vector2(JAR_R, FLOOR + (WALL_TOP - FLOOR) * i / 20));
  for (let i = 1; i <= 32; i++) { const a = i / 32 * Math.PI / 2; prof.push(new THREE.Vector2(Math.cos(a) * JAR_R, WALL_TOP + Math.sin(a) * JAR_R)); }
  const glass = new THREE.ShaderMaterial({

    fragmentShader: `uniform vec3 uColor; varying vec3 vN; varying vec3 vV; void main(){ float f = pow(1.0-abs(dot(normalize(vN),normalize(vV))), 5.0); gl_FragColor = vec4(uColor*(f*0.2), 1.0); }`,

// ---------- beetles (agents) ----------
function makeBeetle() {
  const g = new THREE.Group();
  const shellMat = new THREE.MeshPhysicalMaterial({ color: 0x15100c, roughness: 0.25, metalness: 0.5, clearcoat: 1, iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [250, 650], envMap: envTex, envMapIntensity: 1.2 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), shellMat); shell.scale.set(0.07, 0.045, 0.11); shell.position.y = 0.02; g.add(shell);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.034, 20, 14), shellMat); head.position.set(0, 0.012, 0.12); g.add(head);
  const seamMat = new THREE.MeshBasicMaterial({ color: glow(C.amber, 2.0) });
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.006, 0.2), seamMat); seam.position.set(0, 0.064, -0.005); g.add(seam);
  const edge = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 6, 48), seamMat); edge.scale.set(0.07, 0.11, 0.07); edge.rotation.x = Math.PI / 2; edge.position.y = 0.02; g.add(edge);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x0f0b08, roughness: 0.6 });
  for (const side of [-1, 1]) for (const z of [-0.05, 0, 0.05]) {
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.003, 0.1, 5), legMat);
    leg.position.set(side * 0.08, 0.0, z); leg.rotation.z = side * 1.1; leg.rotation.y = z * 4 * side; g.add(leg);
  }
  for (const side of [-1, 1]) {
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.09, 4), legMat);
    ant.position.set(side * 0.02, 0.04, 0.17); ant.rotation.x = 1.0; ant.rotation.z = -side * 0.4; g.add(ant);
  }
  return g;
}
const beetles = [];
activeTips.slice(0, 3).forEach((v, i) => {
  const b = makeBeetle(), t = 0.93 - i * 0.03;
  const fi = Math.min(v.segs, Math.round(t * v.segs));
  const T = v.curve.getTangentAt(t), N = v.frames.normals[fi].clone(), X = new V().crossVectors(N, T).normalize();
  b.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, N, T));
  b.position.copy(v.curve.getPointAt(t)).addScaledVector(N, v.rFn(t) + 0.03);
  b.scale.setScalar(1.9);
  scene.add(b); beetles.push({ mesh: b, vine: v });
});

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float rnd(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; d.x *= 1.25;
      float v = smoothstep(0.82, 0.18, length(d)); c.rgb *= mix(0.25, 1.0, v);

// ---------- HUD: stats ----------
document.getElementById('stats').innerHTML = [
  ['branches', merged + open + stale + 1], ['merged', merged], ['open', open], ['stale', stale],
  ['commits', commitCount], ['open issues', issueVines.length], ['agents', beetles.length],

// ---------- HUD: dithered beetle portrait ----------
{
  const S = 96, ps = new THREE.Scene(), b = makeBeetle(); b.scale.setScalar(9); b.rotation.set(0.5, 2.5, 0); ps.add(b);

// ---------- HUD: radar, waveform, timeline ----------
const radar = document.getElementById('radar').getContext('2d');
function drawRadar(t) {
  const W = 400, c = W / 2; radar.clearRect(0, 0, W, W);
  radar.strokeStyle = '#6b4a1a'; radar.lineWidth = 2;
  for (const r of [60, 110, 160, 190]) { radar.beginPath(); radar.arc(c, c, r, 0, 6.283); radar.stroke(); }
  radar.beginPath(); radar.moveTo(c, 10); radar.lineTo(c, W - 10); radar.moveTo(10, c); radar.lineTo(W - 10, c); radar.stroke();
  const a = t * 0.9;
  for (let k = 0; k < 24; k++) {
    radar.strokeStyle = `rgba(255,176,0,${0.5 * (1 - k / 24)})`;
    radar.beginPath(); radar.moveTo(c, c); radar.lineTo(c + Math.cos(a - k * 0.03) * 190, c + Math.sin(a - k * 0.03) * 190); radar.stroke();
  }
  radar.fillStyle = '#ffb000';
  beetles.forEach(({ mesh }) => {
    const ang = Math.atan2(mesh.position.z, mesh.position.x), r = 40 + mesh.position.y * 26;
    radar.fillRect(c + Math.cos(ang) * r - 6, c + Math.sin(ang) * r - 6, 12, 12);
  });
}
const wave = document.getElementById('wave').getContext('2d');
function drawWave(t) {
  wave.clearRect(0, 0, 500, 88); wave.strokeStyle = '#6b4a1a'; wave.lineWidth = 1;
  for (let x = 0; x <= 500; x += 50) { wave.beginPath(); wave.moveTo(x, 0); wave.lineTo(x, 88); wave.stroke(); }
  wave.strokeStyle = '#ffb000'; wave.lineWidth = 2.5; wave.beginPath();
  for (let x = 0; x <= 500; x += 4) {
    const y = 44 + Math.sin(x * 0.045 + t * 3) * 16 * Math.sin(x * 0.008 + t) + Math.sin(x * 0.21 - t * 7) * 5;
    x ? wave.lineTo(x, y) : wave.moveTo(x, y);
  }
  wave.stroke();
}
{
  const tl = document.getElementById('timeline').getContext('2d'), n = activity.length, w = 1440 / n;
  tl.fillStyle = '#6b4a1a'; tl.fillRect(0, 88, 1440, 2);
  activity.forEach((v, i) => { tl.fillStyle = i > n - 15 ? '#ffb000' : '#6b4a1a'; const h = 6 + v * 70; tl.fillRect(i * w + w * 0.3, 86 - h, w * 0.4, h); });
}

// ---------- HUD: labels with leader lines ----------
const svg = document.getElementById('labels');
const labelTargets = [
  { text: 'main', get: () => mainCurve.getPointAt(0.97) },
  ...vines.filter((v) => v.name && v.kind !== 'main').map((v) => ({ text: v.name, dim: v.kind === 'stale', get: () => v.curve.getPointAt(1) })),
];
function drawLabels(W, H) {
  const jarEdge = new V(JAR_R, 3, 0).project(camera), cx = W / 2, half = Math.abs((jarEdge.x + 1) / 2 * W - cx) + 70;
  const items = labelTargets.map((l) => {
    const p = l.get().clone().project(camera);
    return { ...l, x: (p.x + 1) / 2 * W, y: (1 - p.y) / 2 * H, front: p.z < 1 };
  }).filter((l) => l.front);
  const placed = { L: [], R: [] };
  let out = '';
  items.sort((a, b) => a.y - b.y).forEach((l) => {
    const side = l.x < cx ? 'L' : 'R', list = placed[side];
    let ly = l.y; for (const y of list) if (Math.abs(ly - y) < 22) ly = y + 22; list.push(ly);
    const lx = side === 'L' ? cx - half : cx + half, col = l.dim ? '#6b4a1a' : '#ffb000';
    const ex = side === 'L' ? lx + 8 : lx - 8;
    out += `<polyline points="${l.x},${l.y} ${ex},${ly} ${lx},${ly}" fill="none" stroke="${col}" stroke-width="1" opacity=".75"/>`;
    out += `<rect x="${l.x - 2.5}" y="${l.y - 2.5}" width="5" height="5" fill="none" stroke="${col}"/>`;
    out += `<text x="${side === 'L' ? lx - 6 : lx + 6}" y="${ly + 4}" fill="${col}" font-size="11" letter-spacing="1" text-anchor="${side === 'L' ? 'end' : 'start'}" font-family="IBM Plex Mono, monospace">${l.text.toUpperCase()}</text>`;
  });
  svg.innerHTML = out;
}

// ---------- loop ----------
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W, H);
  camera.aspect = W / H;
  camera.fov = W / H < 1 ? 46 : 30;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
const t0 = performance.now();
function tick() {
  const t = (performance.now() - t0) / 1000;
  controls.update();
  const fp = flow.points.geometry.attributes.position;
  for (let i = 0; i < flow.n; i++) {
    flow.u[i] = (flow.u[i] + 0.0025) % 1;
    const p = pathCurves[flow.path[i]].getPointAt(flow.u[i] * 0.85); fp.setXYZ(i, p.x, p.y, p.z);
  }
  fp.needsUpdate = true;
  const sp = spores.points.geometry.attributes.position;
  for (let i = 0; i < spores.n; i++) { let y = sp.getY(i) + 0.0018; if (y > 6.1) y = 0.8; sp.setY(i, y); }
  sp.needsUpdate = true;
  mists.forEach((m) => { m.position.x = m.userData.base.x + Math.sin(t * 0.15 + m.userData.ph) * 0.15; });
  glowLight.intensity = 3 + Math.sin(t * 1.3) * 0.5;
  finish.uniforms.time.value = t;
  composer.render();
  drawLabels(window.innerWidth, window.innerHeight);
  drawRadar(t); drawWave(t);
  requestAnimationFrame(tick);
}
tick();
window.__ready = true;
