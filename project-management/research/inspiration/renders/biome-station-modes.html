<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biome Station Modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #eceae6; --ink: #141210; --ink-dim: rgba(20, 18, 16, .5); --ink-faint: rgba(20, 18, 16, .35); --red: #e5261a;
    --glass-bg: rgba(255, 255, 255, .42); --glass-border: rgba(255, 255, 255, .75); --glass-line: rgba(20, 18, 16, .08);
    --glass-shadow: 0 10px 30px rgba(40, 30, 20, .12), inset 0 1px 0 rgba(255, 255, 255, .8);
    --item-bg: rgba(255, 255, 255, .35); --item-border: rgba(20, 18, 16, .1);
  }
  :root[data-theme="dark"] {
    --page: #05060a; --ink: #eeebe5; --ink-dim: rgba(238, 235, 229, .5); --ink-faint: rgba(238, 235, 229, .3); --red: #ff4a3d;
    --glass-bg: rgba(18, 19, 25, .45); --glass-border: rgba(255, 255, 255, .12); --glass-line: rgba(255, 255, 255, .08);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 255, 255, .08);
    --item-bg: rgba(255, 255, 255, .04); --item-border: rgba(255, 255, 255, .1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--ink); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  svg#labels { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hud { position: fixed; font-size: 11px; letter-spacing: .06em; pointer-events: none; color: var(--ink); }
  .win { border: 1px solid var(--glass-border); background: var(--glass-bg); border-radius: 12px; overflow: hidden;
    backdrop-filter: blur(16px) saturate(140%); -webkit-backdrop-filter: blur(16px) saturate(140%); box-shadow: var(--glass-shadow); }
  .win .bar { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--glass-line); text-transform: uppercase; font-weight: 500; }
  .win .bar .ctl { color: var(--ink-faint); letter-spacing: .3em; }
  .dim { color: var(--ink-dim); }
  .red { color: var(--red); }
  #brand { top: 22px; left: 24px; font-size: 12px; text-transform: uppercase; line-height: 1.6; }
  #brand b { font-weight: 500; }
  #theme { position: fixed; top: 20px; right: 24px; pointer-events: auto; cursor: pointer; font: inherit; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink); padding: 8px 14px; display: flex; gap: 8px; align-items: center; }
  #theme:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  #theme .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); }
  #term { left: 24px; bottom: 24px; width: min(460px, calc(100% - 48px)); }
  #term pre { margin: 0; padding: 12px 12px 14px; min-height: 150px; font: inherit; font-size: 12px; line-height: 1.65; letter-spacing: .02em; white-space: pre-wrap; }
  #term .cursor { display: inline-block; width: 8px; height: 13px; background: var(--red); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #panel { left: calc(24px + min(460px, calc(100% - 48px)) + 12px); bottom: 24px; width: 250px; }
  #panel .sec { padding: 8px 10px 4px; text-transform: uppercase; }
  #panel .sec h3 { margin: 0 0 6px; font-size: 10px; font-weight: 500; color: var(--ink-dim); letter-spacing: .12em; }
  #panel .item { display: flex; justify-content: space-between; border: 1px solid var(--item-border); background: var(--item-bg); border-radius: 6px; padding: 5px 8px; margin-bottom: 6px; }
  .sw { display: inline-block; width: 7px; height: 7px; margin-right: 8px; vertical-align: 0; border-radius: 50%; }
  @media (max-width: 900px) { #panel, svg#labels { display: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<svg id="labels"></svg>
<button class="win" id="theme" type="button" aria-label="Switch light or dark mode"><span class="dot"></span><span id="themeLabel">dark mode</span></button>

<div class="hud" id="brand"><b>gitspore</b> <span class="dim">// biome station</span><br><span class="dim">4 repos · 2 agents running</span></div>

<div class="hud win" id="term">
  <div class="bar"><span>agent_claude_01 <span class="red">[running]</span></span><span class="ctl">_ □ ×</span></div>
  <pre id="termText"></pre>
</div>

<div class="hud win" id="panel">
  <div class="bar"><span>hud</span><span class="ctl">×</span></div>
  <div class="sec"><h3>active agents</h3>
    <div class="item"><span><span class="red">&gt;_</span> agent_claude_01</span><span class="dim">core</span></div>
    <div class="item"><span><span class="red">&gt;_</span> agent_claude_02</span><span class="dim">auth</span></div>
  </div>
  <div class="sec"><h3>open issues</h3>
    <div class="item"><span><i class="sw" style="background:var(--ink)"></i>glitches</span><span id="issueCount">0</span></div>
  </div>
  <div class="sec"><h3>active prs</h3>
    <div class="item"><span><i class="sw" style="background:var(--red)"></i>blooming</span><span id="prCount">0</span></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
// Textures: CC0 from Poly Haven (polyhaven.com), loaded from their CDN at 1k.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V = THREE.Vector3;
const C = {
  amber: 0xffa000, cyan: 0xff2d1f, blue: 0x3aa0ff, violet: 0x9b6bff, magenta: 0xff4fd8,
  coral: 0xff5a4f, bronze: 0x7a5236, strut: 0x2c3240, leaf: 0xeeebe6, leaf2: 0xe4e0da, moss: 0xebe6de,
};
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(7);
const rr = (a, b) => a + (b - a) * rand();
const glow = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

// ---------- renderer ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe6e2dc, 26, 90);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.16;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
camera.position.set(-1.0, 4.4, 11.8);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.2, -0.3, -0.5);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 16;

const hemi = new THREE.HemisphereLight(0xffffff, 0x9a9086, 0.32); scene.add(hemi);
const moon = new THREE.DirectionalLight(0xfffaf2, 2.6); moon.position.set(-9, 6.5, 4); scene.add(moon);
moon.castShadow = true; moon.shadow.mapSize.set(4096, 4096); moon.shadow.radius = 2; moon.shadow.bias = -0.0005; moon.shadow.normalBias = 0.012;
Object.assign(moon.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 45 });
const warm = new THREE.DirectionalLight(0xffe6d0, 0.25); warm.position.set(8, 2, -6); scene.add(warm);

// ---------- textures ----------
const loader = new THREE.TextureLoader();
const PH = 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/';
let pending = 0;
function phSet(id, rx = 1, ry = 1) {
  const f = (m) => { pending++; const t = loader.load(`${PH}${id}/${id}_${m}_1k.jpg`, () => pending--, undefined, () => pending--); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t; };
  const map = f('diff'); map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap: f('nor_gl'), roughnessMap: f('rough'), roughness: 1 };
}
function phRelief(id, rx = 1, ry = 1, strength = 1) {
  pending++;
  const t = loader.load(`${PH}${id}/${id}_nor_gl_1k.jpg`, () => pending--, undefined, () => pending--);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8;
  return { normalMap: t, normalScale: new THREE.Vector2(strength, strength) };
}
// Light mode: off-white, slightly plastic. Tones vary a little so objects stay distinct.
// ---------- light / dark theme registry ----------
// Every material that changes between modes registers its light and dark values here.
const themed = [];
const modeU = { value: 0 }; // shared shader uniform: 0 light, 1 dark
function theme(mat, light, dark) { themed.push({ mat, light, dark }); return mat; }
const darkOf = (hex, k = 0.035) => new THREE.Color(hex).multiplyScalar(k);
function clay(tone, rough = 0.6, extra = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: tone, roughness: rough, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.45, ...extra });
  return theme(m, { color: new THREE.Color(tone) }, { color: darkOf(tone) });
}

let skyMat, starMat, paneMat;
// ---------- sky and geodesic dome ----------
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color(0xf6f4f0) }, mid: { value: new THREE.Color(0xeeebe6) }, hor: { value: new THREE.Color(0xe4e0da) }, bot: { value: new THREE.Color(0xd8d3cc) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 top, mid, hor, bot; varying vec3 vDir;
      void main(){ float h = vDir.y; vec3 c = h > 0.0 ? mix(mix(hor, mid, smoothstep(0.0, 0.3, h)), top, smoothstep(0.3, 0.9, h)) : mix(hor, bot, smoothstep(0.0, -0.35, h));
      gl_FragColor = vec4(c, 1.0); }`,
  }));
  scene.add(sky); skyMat = sky.material;
  // stars
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new V(rr(-1, 1), rr(0.05, 1), rr(-1, 1)).normalize().multiplyScalar(140); pos.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  starMat = theme(new THREE.PointsMaterial({ color: 0x9aa6c8, size: 0.35, sizeAttenuation: true, fog: false, transparent: true, opacity: 0 }), { opacity: 0 }, { opacity: 1 });
  scene.add(new THREE.Points(g, starMat));

  // geodesic dome: struts and joints
  const R = 22, cy = -6;
  const geo = new THREE.IcosahedronGeometry(R, 3), p = geo.attributes.position, seen = new Set(), segs = [];
  const key = (v) => `${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)}`;
  for (let i = 0; i < p.count; i += 3) {
    const tri = [0, 1, 2].map((k) => new V().fromBufferAttribute(p, i + k));
    for (const [a, b] of [[0, 1], [1, 2], [2, 0]]) {
      const A = tri[a], B = tri[b]; if (A.y < -4 && B.y < -4) continue;
      const id = [key(A), key(B)].sort().join('|'); if (seen.has(id)) continue; seen.add(id); segs.push([A, B]);
    }
  }
  const strutMat = clay(0xe6e2dc, 0.55);
  const struts = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6), strutMat, segs.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new V(0, 1, 0);
  segs.forEach(([A, B], i) => {
    const d = new V().subVectors(B, A), len = d.length();
    q.setFromUnitVectors(up, d.normalize());
    m.compose(new V().addVectors(A, B).multiplyScalar(0.5).add(new V(0, cy, 0)), q, new V(0.035, len, 0.035)); struts.setMatrixAt(i, m);
  });
  scene.add(struts);
  // faint glass panes
  const pane = new THREE.Mesh(geo, theme(new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.1, transparent: true, opacity: 0.03, side: THREE.BackSide, depthWrite: false }), { color: new THREE.Color(0xffffff), opacity: 0.03 }, { color: new THREE.Color(0x8aa0c8), opacity: 0.025 }));
  pane.position.y = cy; scene.add(pane);
  // ground far below
  const ground = new THREE.Mesh(new THREE.CircleGeometry(R, 64), clay(0xe2ded7, 0.8, phRelief('rocks_ground_06', 10, 10, 0.8)));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -9; scene.add(ground);
}

// ---------- shared materials ----------
const bronze = clay(0xd9d5ce, 0.5);
const glass = theme(new THREE.MeshPhysicalMaterial({ color: 0xffffff, metalness: 0, roughness: 0.05, transparent: true, opacity: 0.09, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.9 }), { color: new THREE.Color(0xffffff), opacity: 0.09 }, { color: new THREE.Color(0xc8d6f0), opacity: 0.05 });
const soilTop = clay(0xf1eee9, 0.75, phRelief('forest_ground_04', 3, 1, 1.2));
const soilSide = clay(0xe8e4de, 0.7, phRelief('rocks_ground_06', 4, 0.6, 0.8));
const rockMat = clay(0xece8e2, 0.65, phRelief('rock_boulder_dry', 1, 1, 1.4));
// Dark bark (CC0 texture). Light runs in thin broken veins along the bark, plus slow pulses
// travelling along the branch (one pulse ~ data moving through it).
const glowShaders = [];
function barkMat(base, pulseAmp, tint = 0xf3f0eb) {
  const m = theme(new THREE.MeshPhysicalMaterial({ color: tint, roughness: 0.55, clearcoat: 0.35, clearcoatRoughness: 0.4, ...phRelief('bark_willow_02', 1, 0.5, 1.3), metalness: 0 }), { color: new THREE.Color(tint) }, { color: darkOf(tint, 0.03) });
  const phase = rand() * 10;
  m.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, { uGlow: { value: new THREE.Color(C.cyan) }, uBase: { value: base }, uPulseAmp: { value: pulseAmp }, uTime: { value: 0 }, uPhase: { value: phase }, uMode: modeU });
    sh.vertexShader = 'varying vec2 vLineUv;\n' + sh.vertexShader.replace('#include <uv_vertex>', '#include <uv_vertex>\n vLineUv = uv;');
    sh.fragmentShader = 'varying vec2 vLineUv;\nuniform vec3 uGlow;\nuniform float uBase, uPulseAmp, uTime, uPhase, uMode;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float vx = vLineUv.x * 3.0 + 0.12 * sin(vLineUv.y * 2.3 + uPhase) + 0.05 * sin(vLineUv.y * 7.1);
      float crack = 1.0 - smoothstep(0.0, 0.06, abs(fract(vx) - 0.5));
      crack *= smoothstep(0.1, 0.35, fract(vLineUv.y * 0.45 + uPhase * 0.3 + floor(vx) * 0.37));
      float p = fract(vLineUv.y * 0.3 - uTime * 0.3 + uPhase);
      float pulse = smoothstep(0.0, 0.05, p) * smoothstep(0.28, 0.05, p);
      diffuseColor.rgb = mix(diffuseColor.rgb, uGlow, (1.0 - uMode) * clamp(crack * (0.85 + pulse) * step(0.01, uBase), 0.0, 1.0));
      totalEmissiveRadiance += uGlow * crack * (uBase + pulse * uPulseAmp) * mix(0.25, 0.7, uMode);`);
    glowShaders.push(sh);
  };
  return m;
}

// ---------- helpers ----------
function strutsFor(segments, radius, mat, group) {
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8), mat, segments.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new V(0, 1, 0);
  segments.forEach(([A, B], i) => {
    const d = new V().subVectors(B, A), len = d.length(); q.setFromUnitVectors(up, d.normalize());
    m.compose(new V().addVectors(A, B).multiplyScalar(0.5), q, new V(radius, len, radius)); im.setMatrixAt(i, m);
  });
  group.add(im);
}
function taperTube(curve, segs, radial, rFn) {
  const frames = curve.computeFrenetFrames(segs, false), pos = [], nor = [], uv = [], idx = [], P = new V(), n = new V(), L = curve.getLength();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs; curve.getPointAt(t, P); const N = frames.normals[i], B = frames.binormals[i], r = rFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2; n.set(0, 0, 0).addScaledVector(N, Math.cos(a)).addScaledVector(B, Math.sin(a)).normalize();
      pos.push(P.x + n.x * r, P.y + n.y * r, P.z + n.z * r); nor.push(n.x, n.y, n.z); uv.push(j / radial, t * L * 2);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) { const a = i * (radial + 1) + j, b = a + radial + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
}
function rockGeometry(r) {
  const g = new THREE.IcosahedronGeometry(r, 4), p = g.attributes.position, v = new V(), sd = rand() * 10;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const k = 1 + 0.18 * Math.sin(v.x * 5 / r + sd) * Math.sin(v.y * 6 / r + sd * 2) * Math.sin(v.z * 4 / r + sd * 3); v.multiplyScalar(k); v.y *= 0.6; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}

// ---------- beetle ----------
function makeBeetle() {
  const g = new THREE.Group();
  const shellMat = theme(new THREE.MeshPhysicalMaterial({ color: 0xf7f5f2, roughness: 0.18, metalness: 0, clearcoat: 1, clearcoatRoughness: 0.1, iridescenceIOR: 1.7, iridescenceThicknessRange: [250, 650] }),
    { color: new THREE.Color(0xf7f5f2), metalness: 0, iridescence: 0 }, { color: new THREE.Color(0x16130f), metalness: 0.5, iridescence: 1 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), shellMat); shell.scale.set(0.07, 0.045, 0.11); shell.position.y = 0.02; g.add(shell);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.034, 20, 14), shellMat); head.position.set(0, 0.012, 0.12); g.add(head);
  const seamMat = theme(new THREE.MeshBasicMaterial({ color: glow(C.amber, 1.4) }), { color: glow(C.amber, 1.4) }, { color: glow(C.amber, 1.6) });
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.01, 0.2), seamMat); seam.position.set(0, 0.064, -0.005); g.add(seam);
  const legMat = clay(0xd4cfc8, 0.5);
  for (const s of [-1, 1]) for (const z of [-0.05, 0, 0.05]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.003, 0.1, 5), legMat); leg.position.set(s * 0.08, 0, z); leg.rotation.z = s * 1.1; leg.rotation.y = z * 4 * s; g.add(leg); }
  for (const s of [-1, 1]) { const a = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.09, 4), legMat); a.position.set(s * 0.02, 0.04, 0.17); a.rotation.x = 1.0; a.rotation.z = -s * 0.4; g.add(a); }
  return g;
}

// ---------- flora pieces ----------
const petalGeo = new THREE.SphereGeometry(1, 16, 8);
function flower(group, P, size, hex) {
  const f = new THREE.Group(); f.position.copy(P);
  const stemH = size * rr(2.2, 3.4);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(size * 0.06, size * 0.09, stemH, 6), clay(0xe8e4de, 0.6));
  stem.position.y = stemH / 2; f.add(stem);
  const head = new THREE.Group(); head.position.y = stemH; head.rotation.set(rr(-0.4, 0.4), 0, rr(-0.4, 0.4)); f.add(head);
  const pm = theme(new THREE.MeshStandardMaterial({ color: new THREE.Color(0xff5a4a), emissive: new THREE.Color(hex), emissiveIntensity: 0.3, roughness: 0.35, transparent: true, opacity: 0.85, side: THREE.DoubleSide }),
    { color: new THREE.Color(0xff5a4a), emissiveIntensity: 0.3 }, { color: new THREE.Color(0x2a0605), emissiveIntensity: 1.5 });
  const n = 6;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2, p = new THREE.Mesh(petalGeo, pm);
    p.scale.set(size * 0.32, size * 0.04, size * 0.8); p.position.set(Math.sin(a) * size * 0.6, size * 0.12, Math.cos(a) * size * 0.6);
    p.rotation.y = a; p.rotation.x = -0.45; head.add(p);
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(size * 0.18, 12, 8), theme(new THREE.MeshBasicMaterial({ color: glow(0xff2d1f, 1.0) }), { color: glow(0xff2d1f, 1.0) }, { color: glow(0xff6a5e, 2.6) })); core.position.y = size * 0.14; head.add(core);
  group.add(f);
}
function crystalCluster(group, P, s, hex) {
  const mat = theme(new THREE.MeshPhysicalMaterial({ color: hex, roughness: 0.3, metalness: 0, transmission: 0.55, thickness: 0.3, flatShading: true, envMapIntensity: 1.6 }),
    { color: new THREE.Color(hex), transmission: 0.55 }, { color: new THREE.Color(0x2a3038), transmission: 0.25 });
  for (let k = 0; k < 5; k++) {
    const c = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mat);

  document.documentElement.dataset.theme = name;
  document.getElementById('themeLabel').textContent = dark ? 'light mode' : 'dark mode';
  current = name;
}
const params = new URLSearchParams(location.search);
let current = params.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(current);
document.getElementById('theme').addEventListener('click', () => applyTheme(current === 'dark' ? 'light' : 'dark'));
window.__theme = applyTheme;
window.__texturesLoaded = () => pending === 0;
window.__view = (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); };
</script>
