<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biome Station Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05060a;
    --panel: rgba(9, 7, 4, .86);
    --amber: #ffb000;
    --amber-dim: #6b4a1a;
    --cyan: #3ef2d0;
    --coral: #ff5a4f;
    --violet: #b98cff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: "IBM Plex Mono", ui-monospace, monospace; color: var(--amber); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  svg#labels { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hud { position: fixed; font-size: 11px; letter-spacing: .06em; pointer-events: none; }
  .win { border: 1px solid var(--amber-dim); background: var(--panel); }
  .win .bar { display: flex; justify-content: space-between; gap: 12px; padding: 6px 10px; border-bottom: 1px solid var(--amber-dim); text-transform: uppercase; }
  .win .bar .ctl { color: var(--amber-dim); letter-spacing: .3em; }
  .dim { color: var(--amber-dim); }
  #brand { top: 22px; left: 24px; font-size: 12px; text-transform: uppercase; line-height: 1.6; }
  #brand b { font-weight: 500; }
  #term { left: 24px; bottom: 24px; width: min(460px, calc(100% - 48px)); }
  #term pre { margin: 0; padding: 12px 12px 14px; min-height: 150px; font: inherit; font-size: 12px; line-height: 1.65; letter-spacing: .02em; white-space: pre-wrap; }
  #term .cursor { display: inline-block; width: 8px; height: 13px; background: var(--amber); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #panel { left: calc(24px + min(460px, calc(100% - 48px)) + 12px); bottom: 24px; width: 250px; }
  #panel .sec { padding: 8px 10px 4px; text-transform: uppercase; }
  #panel .sec h3 { margin: 0 0 6px; font-size: 10px; font-weight: 500; color: var(--amber-dim); letter-spacing: .12em; }
  #panel .item { display: flex; justify-content: space-between; border: 1px solid var(--amber-dim); padding: 4px 8px; margin-bottom: 6px; }
  .sw { display: inline-block; width: 7px; height: 7px; margin-right: 8px; vertical-align: 0; }
  @media (max-width: 900px) { #panel, svg#labels { display: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<svg id="labels"></svg>

<div class="hud" id="brand"><b>gitspore</b> <span class="dim">// biome station</span><br><span class="dim">4 repos · 2 agents running</span></div>

<div class="hud win" id="term">
  <div class="bar"><span>agent_claude_01 <span style="color:var(--cyan)">[running]</span></span><span class="ctl">_ □ ×</span></div>
  <pre id="termText"></pre>
</div>

<div class="hud win" id="panel">
  <div class="bar"><span>hud</span><span class="ctl">×</span></div>
  <div class="sec"><h3>active agents</h3>
    <div class="item"><span>&gt;_ agent_claude_01</span><span>core</span></div>
    <div class="item"><span>&gt;_ agent_claude_02</span><span>auth</span></div>
  </div>
  <div class="sec"><h3>open issues</h3>
    <div class="item"><span><i class="sw" style="background:var(--coral)"></i>glitches</span><span id="issueCount">0</span></div>
  </div>
  <div class="sec"><h3>active prs</h3>
    <div class="item"><span><i class="sw" style="background:var(--violet)"></i>blooming</span><span id="prCount">0</span></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<script type="module">
// Textures: CC0 from Poly Haven (polyhaven.com), loaded from their CDN at 1k.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V = THREE.Vector3;
const C = {
  amber: 0xffb000, cyan: 0x3ef2d0, blue: 0x3aa0ff, violet: 0x9b6bff, magenta: 0xff4fd8,
  coral: 0xff5a4f, bronze: 0x7a5236, strut: 0x2c3240, leaf: 0x1f5244, leaf2: 0x2f6e52, moss: 0x24402c,
};
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rand = mulberry32(7);
const rr = (a, b) => a + (b - a) * rand();
const glow = (hex, k) => new THREE.Color(hex).multiplyScalar(k);

// ---------- renderer ----------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0d16, 16, 60);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 300);
camera.position.set(-1.0, 4.4, 11.8);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0.2, -0.3, -0.5);
controls.enableDamping = true;
controls.minDistance = 3; controls.maxDistance = 16;

scene.add(new THREE.HemisphereLight(0x5a6a9a, 0x1a1210, 0.9));
const moon = new THREE.DirectionalLight(0xaab8ff, 1.2); moon.position.set(-6, 10, 4); scene.add(moon);
const warm = new THREE.DirectionalLight(0xffc89a, 0.35); warm.position.set(8, 2, -6); scene.add(warm);

// ---------- textures ----------
const loader = new THREE.TextureLoader();
const PH = 'https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/';
let pending = 0;
function phSet(id, rx = 1, ry = 1) {
  const f = (m) => { pending++; const t = loader.load(`${PH}${id}/${id}_${m}_1k.jpg`, () => pending--, undefined, () => pending--); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); t.anisotropy = 8; return t; };
  const map = f('diff'); map.colorSpace = THREE.SRGBColorSpace;
  return { map, normalMap: f('nor_gl'), roughnessMap: f('rough'), roughness: 1 };
}

// ---------- sky and geodesic dome ----------
{
  const sky = new THREE.Mesh(new THREE.SphereGeometry(150, 48, 24), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false,
    uniforms: { top: { value: new THREE.Color(0x05060c) }, mid: { value: new THREE.Color(0x111628) }, hor: { value: new THREE.Color(0x2a2238) }, bot: { value: new THREE.Color(0x0a0808) } },
    vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform vec3 top, mid, hor, bot; varying vec3 vDir;
      void main(){ float h = vDir.y; vec3 c = h > 0.0 ? mix(mix(hor, mid, smoothstep(0.0, 0.3, h)), top, smoothstep(0.3, 0.9, h)) : mix(hor, bot, smoothstep(0.0, -0.35, h));
      gl_FragColor = vec4(c, 1.0); }`,
  }));
  scene.add(sky);
  // stars
  const n = 900, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const v = new V(rr(-1, 1), rr(0.05, 1), rr(-1, 1)).normalize().multiplyScalar(140); pos.set([v.x, v.y, v.z], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9aa6c8, size: 0.35, sizeAttenuation: true, fog: false })));

  // geodesic dome: struts and joints
  const R = 22, cy = -6;
  const geo = new THREE.IcosahedronGeometry(R, 3), p = geo.attributes.position, seen = new Set(), segs = [];
  const key = (v) => `${v.x.toFixed(2)},${v.y.toFixed(2)},${v.z.toFixed(2)}`;
  for (let i = 0; i < p.count; i += 3) {
    const tri = [0, 1, 2].map((k) => new V().fromBufferAttribute(p, i + k));
    for (const [a, b] of [[0, 1], [1, 2], [2, 0]]) {
      const A = tri[a], B = tri[b]; if (A.y < -4 && B.y < -4) continue;
      const id = [key(A), key(B)].sort().join('|'); if (seen.has(id)) continue; seen.add(id); segs.push([A, B]);
    }
  }
  const strutMat = new THREE.MeshStandardMaterial({ color: C.strut, metalness: 0.85, roughness: 0.4 });
  const struts = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 6), strutMat, segs.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new V(0, 1, 0);
  segs.forEach(([A, B], i) => {
    const d = new V().subVectors(B, A), len = d.length();
    q.setFromUnitVectors(up, d.normalize());
    m.compose(new V().addVectors(A, B).multiplyScalar(0.5).add(new V(0, cy, 0)), q, new V(0.09, len, 0.09)); struts.setMatrixAt(i, m);
  });
  scene.add(struts);
  // faint glass panes
  const pane = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0x8aa0c8, metalness: 0, roughness: 0.1, transparent: true, opacity: 0.05, side: THREE.BackSide, depthWrite: false }));
  pane.position.y = cy; scene.add(pane);
  // ground far below
  const ground = new THREE.Mesh(new THREE.CircleGeometry(R, 64), new THREE.MeshStandardMaterial({ color: 0x1a1614, ...phSet('rocks_ground_06', 10, 10) }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -9; scene.add(ground);
}

// ---------- shared materials ----------
const bronze = new THREE.MeshStandardMaterial({ color: C.bronze, metalness: 0.9, roughness: 0.38 });
const glass = new THREE.MeshPhysicalMaterial({ color: 0xc8d6f0, metalness: 0, roughness: 0.04, transparent: true, opacity: 0.05, side: THREE.DoubleSide, depthWrite: false, envMapIntensity: 0.5 });
const soilTop = new THREE.MeshStandardMaterial({ color: 0x5a4a3c, ...phSet('forest_ground_04', 3, 1) });
const soilSide = new THREE.MeshStandardMaterial({ color: 0x3a2e26, ...phSet('rocks_ground_06', 4, 0.6) });
const rockMat = new THREE.MeshStandardMaterial({ color: 0x6a6058, ...phSet('rock_boulder_dry', 1, 1) });
const barkMat = (glowHex, k) => new THREE.MeshStandardMaterial({ color: 0x2a2a30, emissive: new THREE.Color(glowHex), emissiveIntensity: k, roughness: 0.4, metalness: 0.1 });

// ---------- helpers ----------
function strutsFor(segments, radius, mat, group) {
  const im = new THREE.InstancedMesh(new THREE.CylinderGeometry(1, 1, 1, 8), mat, segments.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new V(0, 1, 0);
  segments.forEach(([A, B], i) => {
    const d = new V().subVectors(B, A), len = d.length(); q.setFromUnitVectors(up, d.normalize());
    m.compose(new V().addVectors(A, B).multiplyScalar(0.5), q, new V(radius, len, radius)); im.setMatrixAt(i, m);
  });
  group.add(im);
}
function taperTube(curve, segs, radial, rFn) {
  const frames = curve.computeFrenetFrames(segs, false), pos = [], nor = [], uv = [], idx = [], P = new V(), n = new V(), L = curve.getLength();
  for (let i = 0; i <= segs; i++) {
    const t = i / segs; curve.getPointAt(t, P); const N = frames.normals[i], B = frames.binormals[i], r = rFn(t);
    for (let j = 0; j <= radial; j++) {
      const a = j / radial * Math.PI * 2; n.set(0, 0, 0).addScaledVector(N, Math.cos(a)).addScaledVector(B, Math.sin(a)).normalize();
      pos.push(P.x + n.x * r, P.y + n.y * r, P.z + n.z * r); nor.push(n.x, n.y, n.z); uv.push(j / radial, t * L * 2);
    }
  }
  for (let i = 0; i < segs; i++) for (let j = 0; j < radial; j++) { const a = i * (radial + 1) + j, b = a + radial + 1; idx.push(a, b, a + 1, b, b + 1, a + 1); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
}
function rockGeometry(r) {
  const g = new THREE.IcosahedronGeometry(r, 4), p = g.attributes.position, v = new V(), sd = rand() * 10;
  for (let i = 0; i < p.count; i++) { v.fromBufferAttribute(p, i); const k = 1 + 0.18 * Math.sin(v.x * 5 / r + sd) * Math.sin(v.y * 6 / r + sd * 2) * Math.sin(v.z * 4 / r + sd * 3); v.multiplyScalar(k); v.y *= 0.6; p.setXYZ(i, v.x, v.y, v.z); }
  g.computeVertexNormals(); return g;
}

// ---------- beetle ----------
function makeBeetle() {
  const g = new THREE.Group();
  const shellMat = new THREE.MeshPhysicalMaterial({ color: 0x1a1612, roughness: 0.22, metalness: 0.55, clearcoat: 1, iridescence: 1, iridescenceIOR: 1.7, iridescenceThicknessRange: [250, 650], envMapIntensity: 2 });
  const shell = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), shellMat); shell.scale.set(0.07, 0.045, 0.11); shell.position.y = 0.02; g.add(shell);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.034, 20, 14), shellMat); head.position.set(0, 0.012, 0.12); g.add(head);
  const seamMat = new THREE.MeshBasicMaterial({ color: glow(C.amber, 3) });
  const seam = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.006, 0.2), seamMat); seam.position.set(0, 0.064, -0.005); g.add(seam);
  const legMat = new THREE.MeshStandardMaterial({ color: 0x0f0d0b, roughness: 0.6 });
  for (const s of [-1, 1]) for (const z of [-0.05, 0, 0.05]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.003, 0.1, 5), legMat); leg.position.set(s * 0.08, 0, z); leg.rotation.z = s * 1.1; leg.rotation.y = z * 4 * s; g.add(leg); }
  for (const s of [-1, 1]) { const a = new THREE.Mesh(new THREE.CylinderGeometry(0.002, 0.002, 0.09, 4), legMat); a.position.set(s * 0.02, 0.04, 0.17); a.rotation.x = 1.0; a.rotation.z = -s * 0.4; g.add(a); }
  return g;
}

// ---------- flora pieces ----------
const petalGeo = new THREE.SphereGeometry(1, 16, 8);
function flower(group, P, size, hex) {
  const f = new THREE.Group(); f.position.copy(P);
  const stemH = size * rr(2.2, 3.4);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(size * 0.06, size * 0.09, stemH, 6), new THREE.MeshStandardMaterial({ color: 0x1d3a30, roughness: 0.6 }));
  stem.position.y = stemH / 2; f.add(stem);
  const head = new THREE.Group(); head.position.y = stemH; head.rotation.set(rr(-0.4, 0.4), 0, rr(-0.4, 0.4)); f.add(head);
  const pm = new THREE.MeshStandardMaterial({ color: new THREE.Color(hex).multiplyScalar(0.25), emissive: new THREE.Color(hex), emissiveIntensity: 1.2, roughness: 0.35, transparent: true, opacity: 0.92, side: THREE.DoubleSide });
  const n = 6;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2, p = new THREE.Mesh(petalGeo, pm);
    p.scale.set(size * 0.32, size * 0.04, size * 0.8); p.position.set(Math.sin(a) * size * 0.6, size * 0.12, Math.cos(a) * size * 0.6);
    p.rotation.y = a; p.rotation.x = -0.45; head.add(p);
  }
  const core = new THREE.Mesh(new THREE.SphereGeometry(size * 0.18, 12, 8), new THREE.MeshBasicMaterial({ color: glow(0xfff2c8, 2.2) })); core.position.y = size * 0.14; head.add(core);
  group.add(f);
}
function crystalCluster(group, P, s, hex) {
  const mat = new THREE.MeshPhysicalMaterial({ color: hex, emissive: hex, emissiveIntensity: 0.35, roughness: 0.12, metalness: 0.05, transmission: 0.35, thickness: 0.3, flatShading: true, envMapIntensity: 1.6 });
  for (let k = 0; k < 5; k++) {
    const c = new THREE.Mesh(new THREE.OctahedronGeometry(1, 0), mat);
    const h = s * rr(0.5, 1.2); c.scale.set(s * 0.18, h, s * 0.18);
    c.position.copy(P).add(new V(rr(-1, 1) * s * 0.25, h * 0.7, rr(-1, 1) * s * 0.25)); c.rotation.set(rr(-0.4, 0.4), rr(0, 3), rr(-0.4, 0.4)); group.add(c);
  }
}
function mushroom(group, P, s) {
  const stemM = new THREE.MeshStandardMaterial({ color: 0xcfc4ae, roughness: 0.7 });
  const capM = new THREE.MeshStandardMaterial({ color: 0x8a6a52, roughness: 0.55, emissive: new THREE.Color(C.cyan), emissiveIntensity: 0.06 });
  const h = s * rr(0.8, 1.4);
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(s * 0.1, s * 0.14, h, 10), stemM); stem.position.copy(P).add(new V(0, h / 2, 0)); group.add(stem);
  const cap = new THREE.Mesh(new THREE.SphereGeometry(s * 0.38, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), capM); cap.scale.y = 0.6; cap.position.copy(P).add(new V(0, h, 0)); group.add(cap);
  const gill = new THREE.Mesh(new THREE.CircleGeometry(s * 0.36, 20), new THREE.MeshBasicMaterial({ color: glow(C.cyan, 0.7), side: THREE.DoubleSide })); gill.rotation.x = Math.PI / 2; gill.position.copy(cap.position).add(new V(0, 0.002, 0)); group.add(gill);
}
const leafGeo = new THREE.SphereGeometry(1, 10, 6);
function fern(group, P, s) {
  const mat = new THREE.MeshStandardMaterial({ color: rand() < 0.5 ? C.leaf : C.leaf2, roughness: 0.6, side: THREE.DoubleSide });
  const n = 7 + Math.floor(rand() * 5);
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + rr(-0.2, 0.2), l = new THREE.Mesh(leafGeo, mat), len = s * rr(0.6, 1.1);
    l.scale.set(len * 0.18, len * 0.03, len * 0.6);
    const tilt = rr(0.5, 1.0);
    l.position.copy(P).add(new V(Math.sin(a) * len * 0.45, len * 0.32 * Math.cos(tilt) + 0.01, Math.cos(a) * len * 0.45));
    l.rotation.set(-tilt + Math.PI / 2 - Math.PI / 2, a, 0); l.rotateX(-tilt * 0.8); group.add(l);
  }
}

// ---------- terrarium case (one repo) ----------
const cases = [];
let totalIssues = 0, totalPRs = 0;
function makeCase({ L, R, pos, rot, seed, rich, name, agent }) {
  rand = mulberry32(seed);
  const group = new THREE.Group(); group.position.copy(pos); group.rotation.set(...rot); scene.add(group);
  const E = R * 0.7, ang = [...Array(6)].map((_, k) => k * Math.PI / 3);
  const rings = [[-L / 2 - E, 0.55], [-L / 2, 1], [L / 2, 1], [L / 2 + E, 0.55]].map(([x, s]) => ang.map((a) => new V(x, R * s * Math.sin(a), R * s * Math.cos(a))));
  // glass
  const pos3 = [], tri = (a, b, c) => pos3.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
  for (let r = 0; r < 3; r++) for (let k = 0; k < 6; k++) { const a = rings[r][k], b = rings[r][(k + 1) % 6], c = rings[r + 1][(k + 1) % 6], d = rings[r + 1][k]; tri(a, b, c); tri(a, c, d); }
  for (const [ri, x] of [[0, -L / 2 - E], [3, L / 2 + E]]) for (let k = 0; k < 6; k++) tri(new V(x, 0, 0), rings[ri][k], rings[ri][(k + 1) % 6]);
  const gg = new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.Float32BufferAttribute(pos3, 3)); gg.computeVertexNormals();
  group.add(new THREE.Mesh(gg, glass));
  // bronze frame
  const segs = [];
  for (const ring of rings) for (let k = 0; k < 6; k++) segs.push([ring[k], ring[(k + 1) % 6]]);
  for (let r = 0; r < 3; r++) for (let k = 0; k < 6; k++) segs.push([rings[r][k], rings[r + 1][k]]);
  strutsFor(segs, R * 0.028, bronze, group);
  const joint = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), bronze, 24); let ji = 0; const jm = new THREE.Matrix4();
  for (const ring of rings) for (const v of ring) { jm.compose(v, new THREE.Quaternion(), new V(R * 0.045, R * 0.045, R * 0.045)); joint.setMatrixAt(ji++, jm); }
  group.add(joint);
  // end fittings (cable ports)
  for (const s of [-1, 1]) {
    const port = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.12, R * 0.16, R * 0.2, 12), bronze);
    port.rotation.z = Math.PI / 2; port.position.set(s * (L / 2 + E + R * 0.08), 0, 0); group.add(port);
  }
  // soil bed
  const ys = -0.25 * R, yb = -0.84 * R, w = 0.84 * R;
  const soil = new THREE.Mesh(new THREE.BoxGeometry(L + E * 0.6, ys - yb, 2 * w), [soilSide, soilSide, soilTop, soilSide, soilSide, soilSide]);
  soil.position.y = (ys + yb) / 2; group.add(soil);
  const inX = (x) => THREE.MathUtils.clamp(x, -L / 2 - E * 0.25, L / 2 + E * 0.25), inZ = (z) => THREE.MathUtils.clamp(z, -w * 0.88, w * 0.88);
  const onSoil = (x, z) => new V(inX(x), ys, inZ(z));

  // ----- branch network: roots lying on the soil -----
  const sc = R / 1.6, y0 = ys + 0.05 * sc;
  const mainPts = [];
  for (let k = 0; k <= 16; k++) { const x = -L / 2 - E * 0.2 + (L + E * 0.4) * k / 16; mainPts.push(new V(x, y0 + 0.04 * Math.sin(x * 3) * sc, inZ(Math.sin(x * 1.1 + seed) * 0.28 * R))); }
  const main = new THREE.CatmullRomCurve3(mainPts);
  group.add(new THREE.Mesh(taperTube(main, 160, 10, () => 0.075 * sc), barkMat(C.blue, 1.0)));
  const labels = [{ text: name, local: new V(-L / 2, R * 1.05, 0), big: true }, { text: 'main', local: main.getPointAt(0.12).clone().add(new V(0, 0.1, 0)) }];
  const nodePts = [], knots = [], tips = [];
  const bead = (curve, n, col) => { for (let i = 0; i < n; i++) nodePts.push({ p: curve.getPointAt((i + 0.5) / n), c: col }); };
  bead(main, Math.floor(main.getLength() * 6), glow(0xcfe6ff, 1.3));
  const nMerged = rich ? 6 : 3, nOpen = rich ? 3 : 1, nStale = rich ? 2 : 1;
  const featNames = ['feat/user-auth', 'feat/worktrees', 'fix/spore-04', 'feat/terminal', 'chore/ci'];
  for (let b = 0; b < nMerged + nOpen + nStale; b++) {
    const kind = b < nMerged ? 'merged' : b < nMerged + nOpen ? 'open' : 'stale';
    const t0 = rr(0.05, 0.7), side = rand() < 0.5 ? -1 : 1, bulge = rr(0.35, 0.8) * R, pts = [];
    const t1 = Math.min(0.97, t0 + rr(0.18, 0.35)), N = 20;
    for (let k = 0; k <= N; k++) {
      const s = k / N;
      if (kind === 'merged') {
        const base = main.getPointAt(t0 + (t1 - t0) * s);
        pts.push(new V(base.x, y0 + Math.sin(Math.PI * s) * rr(0.02, 0.06) * sc + Math.sin(Math.PI * s) * 0.12 * sc, inZ(base.z + side * Math.pow(Math.sin(Math.PI * s), 0.8) * bulge)));
      } else {
        const base = main.getPointAt(t0);
        const x = base.x + s * rr(0.4, 0.9) * R * (rand() < 0.5 ? 1 : 0.6), z = base.z + side * Math.pow(s, 0.8) * bulge * 1.1;
        const lift = kind === 'open' ? Math.pow(s, 2.2) * rr(0.15, 0.35) * R : Math.sin(s * Math.PI) * 0.05 * sc;
        pts.push(new V(inX(x), y0 + lift, inZ(z)));
      }
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    const colHex = kind === 'stale' ? 0x3a4a5a : rand() < 0.35 ? C.violet : C.cyan;
    const k = kind === 'stale' ? 0.2 : 0.75;
    group.add(new THREE.Mesh(taperTube(curve, 90, 8, (t) => (kind === 'merged' ? 0.045 : THREE.MathUtils.lerp(0.05, 0.016, t)) * sc), barkMat(colHex, k)));
    bead(curve, Math.floor(curve.getLength() * 5), kind === 'stale' ? glow(0x5a6a7a, 0.5) : glow(0xe8fbff, 1.1));
    if (kind === 'merged') knots.push(main.getPointAt(t1));
    if (kind === 'open') tips.push(curve);
    if (b < featNames.length && kind !== 'stale' && rich) labels.push({ text: featNames[b], local: curve.getPointAt(0.5).clone().add(new V(0, 0.08, 0)) });
  }
  // commit beads
  const beads = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), nodePts.length);
  const bm = new THREE.Matrix4();
  nodePts.forEach(({ p, c }, i) => { const s = 0.018 * sc * rr(0.7, 1.3); bm.compose(p, new THREE.Quaternion(), new V(s, s, s)); beads.setMatrixAt(i, bm); beads.setColorAt(i, c); });
  group.add(beads);
  // merges bloom: flowers at the most recent merge points
  knots.forEach((k, i) => {
    const big = i >= knots.length - (rich ? 3 : 1);
    if (big) { for (let j = 0; j < (rich ? 3 : 2); j++) flower(group, k.clone().add(new V(rr(-0.25, 0.25) * sc, 0, rr(-0.25, 0.25) * sc)), rr(0.11, 0.17) * sc, rand() < 0.6 ? C.magenta : C.violet); totalPRs++; }
    else { const knot = new THREE.Mesh(new THREE.SphereGeometry(0.035 * sc, 12, 8), new THREE.MeshBasicMaterial({ color: glow(C.violet, 2) })); knot.position.copy(k); group.add(knot); }
  });
  // rocks with moss
  for (let i = 0; i < (rich ? 7 : 3); i++) {
    const r = rr(0.12, 0.3) * sc, rock = new THREE.Mesh(rockGeometry(r), rockMat);
    rock.position.copy(onSoil(rr(-L / 2, L / 2), rr(-w, w) * 0.9)).add(new V(0, r * 0.15, 0)); rock.rotation.y = rr(0, 6); group.add(rock);
  }
  // moss carpet: instanced clumps
  const mossN = rich ? 1400 : 500, moss = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }), mossN);
  for (let i = 0; i < mossN; i++) {
    const cx = rr(-L / 2, L / 2), cz = rr(-w, w) * 0.9, s = rr(0.012, 0.03) * sc;
    bm.compose(onSoil(cx, cz).add(new V(0, s * 0.3, 0)), new THREE.Quaternion(), new V(s, s * 0.6, s)); moss.setMatrixAt(i, bm);
    moss.setColorAt(i, new THREE.Color(C.moss).multiplyScalar(rr(0.5, 1.4)));
  }
  group.add(moss);
  // ferns, crystals, mushrooms
  for (let i = 0; i < (rich ? 9 : 4); i++) fern(group, onSoil(rr(-L / 2, L / 2), rr(-w, w) * 0.85), rr(0.25, 0.45) * sc);
  for (let i = 0; i < (rich ? 4 : 2); i++) crystalCluster(group, onSoil(rr(-L / 2 - E * 0.2, L / 2 + E * 0.2), rr(-w, w) * 0.8), rr(0.25, 0.45) * sc, rand() < 0.7 ? 0x6a4cff : 0x2fbfa8);
  for (let i = 0; i < (rich ? 4 : 2); i++) mushroom(group, onSoil(rr(-L / 2, L / 2), rr(-w, w) * 0.85), rr(0.18, 0.3) * sc);
  // open issues: coral berries on short stalks
  const nIssues = rich ? 4 : 2;
  for (let i = 0; i < nIssues; i++) {
    const P = onSoil(rr(-L / 2, L / 2), rr(-w, w) * 0.7), h = rr(0.15, 0.3) * sc;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.006 * sc, 0.01 * sc, h, 5), new THREE.MeshStandardMaterial({ color: 0x2a3a2a })); stalk.position.copy(P).add(new V(0, h / 2, 0)); group.add(stalk);
    for (let j = 0; j < 3; j++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.03 * sc, 12, 8), new THREE.MeshStandardMaterial({ color: 0x3a0a08, emissive: C.coral, emissiveIntensity: 2.2 })); b.position.copy(P).add(new V(rr(-0.04, 0.04) * sc, h + rr(-0.02, 0.03) * sc, rr(-0.04, 0.04) * sc)); group.add(b); }
    totalIssues++;
  }
  // agent beetle on an open tip
  if (agent && tips.length) {
    const c = tips[0], t = 0.55, P = c.getPointAt(t), T = c.getTangentAt(t);
    const b = makeBeetle(); b.scale.setScalar(2.6 * sc);
    const N = new V(0, 1, 0).sub(T.clone().multiplyScalar(T.y)).normalize(), X = new V().crossVectors(N, T).normalize();
    b.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, N, T)); b.position.copy(P).addScaledVector(N, 0.05 * sc); group.add(b);
    labels.push({ text: agent, local: P.clone().add(new V(0, 0.32 * sc, 0)), agent: true });
  }
  // inner light: soft cool fill from the roots
  const pl = new THREE.PointLight(C.blue, 1.2 * sc, 2.0 * R, 2); pl.position.set(0, ys + 0.5 * R, 0); group.add(pl);
  const caseInfo = { group, labels, L, R, E }; cases.push(caseInfo); return caseInfo;
}

const core = makeCase({ L: 5.2, R: 1.6, pos: new V(0, 0, 0), rot: [0.12, -0.28, 0.04], seed: 11, rich: true, name: 'repo: core-logic', agent: 'agent_claude_01' });
const auth = makeCase({ L: 2.4, R: 0.95, pos: new V(4.2, 3.1, -4.5), rot: [0.1, 0.35, -0.05], seed: 23, rich: false, name: 'repo: auth-api', agent: 'agent_claude_02' });
const ui = makeCase({ L: 2.0, R: 0.85, pos: new V(-5.4, -2.2, -1.8), rot: [0.15, 0.6, 0.05], seed: 37, rich: false, name: 'repo: ui-kit' });
const docs = makeCase({ L: 1.8, R: 0.8, pos: new V(5.6, -2.0, 0.6), rot: [0.1, -0.9, 0], seed: 41, rich: false, name: 'repo: docs' });
document.getElementById('issueCount').textContent = totalIssues;
document.getElementById('prCount').textContent = totalPRs;

// ---------- cables between cases ----------
{
  const cableMat = new THREE.MeshStandardMaterial({ color: 0x15151a, roughness: 0.45, metalness: 0.3 });
  const port = (c, s) => c.group.localToWorld(new V(s * (c.L / 2 + c.E + c.R * 0.2), 0, 0));
  scene.updateMatrixWorld(true);
  const links = [[port(core, 1), port(auth, -1)], [port(core, -1), port(ui, 1)], [port(core, 1), port(docs, -1)], [port(auth, 1), new V(9, 12, -10)], [port(ui, -1), new V(-12, 8, -6)], [port(docs, 1), new V(12, -4, 4)]];
  for (const [A, B] of links) {
    const mid = new V().addVectors(A, B).multiplyScalar(0.5); mid.y -= A.distanceTo(B) * 0.22;
    const c = new THREE.CatmullRomCurve3([A, new V().lerpVectors(A, mid, 0.5).add(new V(0, -0.2, 0)), mid, new V().lerpVectors(mid, B, 0.5), B]);
    scene.add(new THREE.Mesh(new THREE.TubeGeometry(c, 80, 0.06, 8), cableMat));
  }
}

// floating spores in the dome
const spores = { n: 500 };
{
  const pos = new Float32Array(spores.n * 3);
  for (let i = 0; i < spores.n; i++) pos.set([rr(-10, 10), rr(-4, 7), rr(-8, 6)], i * 3);
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const c = document.createElement('canvas'); c.width = c.height = 32; const x = c.getContext('2d'), gr = x.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)'); x.fillStyle = gr; x.fillRect(0, 0, 32, 32);
  spores.points = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.05, map: new THREE.CanvasTexture(c), color: glow(C.cyan, 1.2), transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending, depthWrite: false }));
  scene.add(spores.points);
}

// ---------- post-processing ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.45, 0.35, 0.9);
composer.addPass(bloom);
const finish = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time; varying vec2 vUv;
    float rnd(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){ vec4 c = texture2D(tDiffuse, vUv); vec2 d = vUv - 0.5; d.x *= 1.3;
      c.rgb *= mix(0.35, 1.0, smoothstep(0.85, 0.2, length(d)));
      c.rgb += (rnd(vUv * 1000.0 + time) - 0.5) * 0.012; gl_FragColor = c; }`,
});
composer.addPass(new OutputPass());
composer.insertPass(finish, 2);

// ---------- labels (amber, with leader lines) ----------
const svg = document.getElementById('labels');
function drawLabels(W, H) {
  let out = '';
  for (const c of cases) for (const l of c.labels) {
    const w = c.group.localToWorld(l.local.clone()), p = w.clone().project(camera);
    if (p.z > 1) continue;
    const x = (p.x + 1) / 2 * W, y = (1 - p.y) / 2 * H, txt = l.text.toUpperCase();
    const fs = l.big ? 12 : 10.5, tw = txt.length * fs * 0.62 + 16, th = fs + 10;
    const lx = x + (l.big ? 0 : 14), ly = y - (l.big ? 22 : 26);
    const col = l.agent ? '#3ef2d0' : '#ffb000';
    out += `<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly + th / 2}" stroke="${col}" stroke-width="1" opacity=".6"/>`;
    out += `<rect x="${x - 2.5}" y="${y - 2.5}" width="5" height="5" fill="none" stroke="${col}" opacity=".9"/>`;
    out += `<rect x="${lx}" y="${ly - th / 2}" width="${tw}" height="${th}" fill="rgba(9,7,4,.85)" stroke="${l.big ? '#ffb000' : '#6b4a1a'}" stroke-width="1"/>`;
    out += `<text x="${lx + 8}" y="${ly + fs * 0.36}" fill="${col}" font-size="${fs}" letter-spacing="1" font-family="IBM Plex Mono, monospace">${txt}</text>`;
  }
  svg.innerHTML = out;
}

// ---------- terminal text ----------
const termLines = [
  '> git worktree add ../wt/feat-user-auth -b feat/user-auth',
  '> claude "implement session refresh in auth module"',
  '  reading src/auth/session.ts ...',
  '  editing src/auth/session.ts (+42 -7)',
  '> npm test -- auth',
  '  PASS  auth/session.spec.ts (12 tests)',
  '> git commit -m "feat(auth): refresh sessions before expiry"',
];
const termEl = document.getElementById('termText');
function drawTerm(t) {
  const chars = Math.floor(t * 38) % (termLines.join('\n').length + 120);
  const text = termLines.join('\n').slice(0, chars);
  termEl.innerHTML = text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '<span class="cursor"></span>';
}

// ---------- loop ----------
function resize() {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W, H);
  camera.aspect = W / H; camera.fov = W / H < 1 ? 60 : 38; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
const t0 = performance.now();
function tick() {
  const t = (performance.now() - t0) / 1000;
  controls.update();
  const sp = spores.points.geometry.attributes.position;
  for (let i = 0; i < spores.n; i++) { let y = sp.getY(i) + 0.003; if (y > 7) y = -4; sp.setY(i, y); }
  sp.needsUpdate = true;
  finish.uniforms.time.value = t;
  composer.render();
  drawLabels(window.innerWidth, window.innerHeight);
  drawTerm(t);
  requestAnimationFrame(tick);
}
tick();
window.__texturesLoaded = () => pending === 0;
window.__view = (pos, target) => { camera.position.set(...pos); controls.target.set(...target); controls.update(); };
</script>
