    --id-0: #7d9fd0; --id-1: #8cc2e0; --id-2: #b39ee0; --id-3: #c27fae; --id-4: #e8dcc4; --id-5: #c9b77a; --id-6: #9aa8b6; --id-7: #8f8cc8;

  /* stage + graph overlay */

  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #graph { position: absolute; top: 12px; left: 12px; width: min(460px, calc(100% - 24px)); max-height: calc(100% - 24px);

  #graph .close { border: 0; background: transparent; color: var(--ink-dim); font-size: 16px; line-height: 1; padding: 2px 6px; }
  #graphBody { position: relative; overflow: auto; min-height: 0; }
  #graphSvg { position: absolute; left: 0; top: 0; overflow: visible; }

  .g-row .age { color: var(--ink-dim); font-size: 11px; font-variant-numeric: tabular-nums; flex: none; }
  .chip i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--c); }
  .idsq { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 7px; vertical-align: 0; background: var(--c); }

  #toast { position: absolute; right: 12px; top: 12px; padding: 8px 12px; font-size: 12px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  #vital .row { display: flex; justify-content: space-between; align-items: baseline; }
  #vitalNum { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }

  .pot-row { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; align-items: center; gap: 8px; text-align: left;

  .pot-row[aria-current="true"] { border-color: var(--ink); }

  :root[data-style="lab"] .pot-row .t { font-weight: 500; font-size: 12px; }

  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--line)); }

  .dot.err { border-radius: 2px; transform: rotate(45deg); }

  @keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; opacity: .35; } }
  #legend { display: grid; grid-template-columns: 12px 1fr; gap: 5px 8px; align-items: center; font-size: 11.5px; color: var(--ink-dim); }
  #note { font-size: 11.5px; line-height: 1.5; color: var(--ink-dim); margin: 0; }

  /* terminal */
  #term { grid-area: term; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #term header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--line); font-size: 12px; }
  #term header b { font-weight: 700; }
  :root[data-style="lab"] #term header { text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  #term header b { font-weight: 500; }
  #termOut { margin: 0; padding: 10px 12px; flex: 1; overflow: auto; font-family: var(--font-mono); font-size: 12px; line-height: 1.6; white-space: pre-wrap; }
  #termOut .p { color: var(--accent); } #termOut .d { color: var(--ink-dim); }

  #termOut .cur { display: inline-block; width: 7px; height: 13px; background: var(--ink); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #termActions { display: flex; gap: 8px; flex-wrap: wrap; }
  .act { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 700; }
  :root[data-style="lab"] .act { border-radius: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; font-size: 10.5px; }
  .act.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  @media (max-width: 860px) {
    #app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 62vh 220px auto; grid-template-areas: "top" "stage" "term" "side"; }
    #graph { max-height: 46%; }
    #hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.pulse, #termOut .cur { animation: none; } }

<div id="app">
  <div id="top">

  </section>
</div>

  return a ? `#${a.issue} ${a.title}` : `#${b.slice(1)}`;
}

// ---------------------------------------------------------------- graph overlay (hand-drawn stand-in for commit-graph)
const ROW = 26, LANE = 15, PADX = 14;
function renderGraph() {
  const rows = commits.slice().reverse();
  const idx = Object.fromEntries(rows.map((c, i) => [c.id, i]));
  const nLanes = Math.max(...Object.values(lanes)) + 1;
  const gw = PADX * 2 + (nLanes - 1) * LANE;
  const X = (l) => PADX + l * LANE, Y = (i) => i * ROW + ROW / 2;
  const sel = slots[selected] ? br(slots[selected]) : null;
  let paths = '', dots = '';
  rows.forEach((c, i) => {
    c.parents.forEach((pid, k) => {
      const j = idx[pid], p = rows[j];
      const xc = X(lanes[c.br]), xp = X(lanes[p.br]), yc = Y(i), yp = Y(j);
      let d, owner;
      if (xc === xp) { d = `M${xc} ${yc}L${xp} ${yp}`; owner = c.br; }
      else if (k === 0) { const yb = yp - ROW; d = `M${xc} ${yc}L${xc} ${yb}C${xc} ${yb + ROW / 2} ${xp} ${yb + ROW / 2} ${xp} ${yp}`; owner = c.br; }
      else { const ya = yc + ROW; d = `M${xp} ${yp}L${xp} ${ya}C${xp} ${ya - ROW / 2} ${xc} ${ya - ROW / 2} ${xc} ${yc}`; owner = p.br; }
      const dash = '';
      paths += `<path data-br="${owner}"${owner === sel ? ' class="sel"' : ''} d="${d}" fill="none" stroke="${branchColor(owner)}" stroke-width="2"${dash}/>`;
    });
    const isHead = Object.entries(heads).some(([b, h]) => h === c.id && b === c.br);
    const merge = c.parents.length > 1;
    dots += `<circle data-br="${c.br}"${c.br === sel ? ' class="sel"' : ''} cx="${X(lanes[c.br])}" cy="${Y(i)}" r="${merge ? 5 : 4}" fill="${isHead ? branchColor(c.br) : 'var(--bg)'}" stroke="${branchColor(c.br)}" stroke-width="2"/>`;
  });
  const svg = $('#graphSvg');
  svg.setAttribute('width', gw); svg.setAttribute('height', rows.length * ROW);
  svg.innerHTML = paths + dots;
  $('#graphRows').innerHTML = rows.map((c) => {
    const chips = Object.entries(heads).filter(([, h]) => h === c.id)
      .filter(([b]) => b === 'main' || slots.some((s) => s && br(s) === b))
      .map(([b]) => `<span class="chip" style="color:${branchColor(b)}">${branchStatus(b) ? `<i style="--c:${branchStatus(b)}"></i>` : ''}${esc(branchLabel(b))}</span>`).join('');
    return `<div class="g-row${c.br === sel ? ' sel' : ''}" data-br="${c.br}" style="padding-left:${gw}px"><span class="sha">${c.sha}</span><span class="msg">${esc(c.msg)}</span>${chips}<span class="age">${c.age}</span></div>`;
  }).join('');
  $('#graph').classList.toggle('has-sel', !!sel);
  const active = slots.filter((s) => s && s.status !== 'merged').length;
  $('#graphMeta').textContent = `${active} active`;
}

// ---------------------------------------------------------------- actions
function act(name, slot = selected) {
  const a = slots[slot];
  if (name === 'answer' || name === 'restart') { a.status = 'working'; a.wait = 0; a.autoWaitAt = performance.now() + 15000; }
  if (name === 'merge') {
    a.status = 'merged';
    commit('main', `merge #${a.issue} ${a.title}`, [heads.main, heads[br(a)]], 'now');
  }
  if (name === 'free') { slots[slot] = null; }
  if (name === 'plant') {
    const empty = slots[slot] ? slots.indexOf(null) : slot;
    if (empty < 0) { toast('No empty pot. Merge or free one first.'); return; }
    plant(empty, 0); return;
  }
  refreshPot(slot); renderUI();
}
function plant(slot, seedIdx) {
  const s = seeds.splice(seedIdx, 1)[0];
  const a = { issue: s.issue, title: s.title, status: 'working', wait: 0, color: freeColors()[0] ?? 0, autoWaitAt: performance.now() + 12000 };
  slots[slot] = a;
  lanes[br(a)] = Math.max(...Object.values(lanes)) + 1;
  heads[br(a)] = heads.main;
  selected = slot;
  toast(`Started Claude on #${s.issue} in worktree GSP-${s.issue}_${s.title}`);
  buildSeeds(); refreshPot(slot); renderUI();
}

    const plate = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.03, 0.84), [edge, edge, face, edge, edge, edge]);
    plate.rotation.x = 0.55; plate.position.y = 0.32; mapObj.add(plate);
    const foot = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.2, 0.3, 2, 0.04), edge); foot.position.set(0, 0.1, -0.12); mapObj.add(foot);
    mapObj.position.set(3.05, 0, 2.15); mapObj.rotation.y = -0.35;
  } else {
    // a blueprint pinned to the back wall, right of the shelf
    const paper = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 1.05), face); mapObj.add(paper);
    const pin = new THREE.MeshStandardMaterial({ color: '#c9442f', roughness: 0.4 });
    for (const [x, y] of [[-0.68, 0.46], [0.68, 0.46]]) { const p = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), pin); p.position.set(x, y, 0.03); mapObj.add(p); }
    mapObj.position.set(4.0, 1.75, -3.55); mapObj.rotation.y = -0.12;
  }
  mapObj.traverse((m) => { if (m.isMesh) { m.userData = { kind: 'map' }; m.castShadow = true; m.receiveShadow = true; } });
  world.add(mapObj);
}

function build() {
  if (world) { scene.remove(world); disposeTree(world); }
  world = new THREE.Group(); scene.add(world);
  potObjs = []; seedGroup = null; mapObj = null;
  pal = PAL[style][isDark() ? 'dark' : 'light'];
  scene.fog.color.set(pal.fog[0]); scene.fog.near = pal.fog[1]; scene.fog.far = pal.fog[2];
  scene.environmentIntensity = style === 'lab' ? (isDark() ? 0.55 : 0.18) : (isDark() ? 0.08 : 0.25);
  renderer.toneMappingExposure = pal.exposure;
  bloom.strength = pal.bloom[0]; bloom.threshold = pal.bloom[1];
  makeSky(); makeLights();
  style === 'lab' ? labEnv() : cozyEnv();
  buildMap();
  for (let i = 0; i < 6; i++) buildPot(i);
  buildSeeds();
}

// ---------------------------------------------------------------- interaction
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function hit(e) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(pickables, false)[0];
  return h ? h.object.userData : null;
}
let drag = null, downAt = null, ghost = null;
canvas.addEventListener('pointerdown', (e) => {
  downAt = [e.clientX, e.clientY];
  const h = hit(e);
  if (h && h.kind === 'seed') { drag = h.idx; controls.enabled = false; canvas.style.cursor = 'grabbing'; ghost = seedObjs[h.idx]; }
});
canvas.addEventListener('pointermove', (e) => {
  if (drag !== null && ghost) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const p = new THREE.Vector3(); ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0, 1, 0), -1.3), p);
    if (p) ghost.position.set(p.x, 1.3, p.z);
    return;
  }
  const h = hit(e);
  canvas.style.cursor = h ? (h.kind === 'seed' ? 'grab' : 'pointer') : '';
  if (mapObj) mapObj.scale.setScalar(h && h.kind === 'map' ? 1.04 : 1);
});
window.addEventListener('pointerup', (e) => {
  const moved = downAt && Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6;
  if (drag !== null) {
    const idx = drag; drag = null; controls.enabled = true; canvas.style.cursor = '';
    const h = e.target === canvas ? hit(e) : null;
    if (h && h.kind === 'pot' && !slots[h.slot]) plant(h.slot, idx);
    else if (!moved) { const empty = slots.indexOf(null); empty >= 0 ? plant(empty, idx) : (toast('No empty pot. Merge or free one first.'), buildSeeds()); }
    else { if (h && h.kind === 'pot') toast('That pot is taken. Drop the seed on an empty pot.'); buildSeeds(); }
    ghost = null; downAt = null; return;
  }
  if (e.target === canvas && !moved) {
    const h = hit(e);
    if (h && h.kind === 'pot') select(h.slot);
    if (h && h.kind === 'map') setGraph($('#graph').hidden);
  }
  downAt = null;
});
function select(i) { selected = i; potObjs.forEach((o, k) => { if (o) o.sel.visible = k === i; }); renderUI(); }

document.addEventListener('click', (e) => {
  const row = e.target.closest('.pot-row'); if (row) select(+row.dataset.slot);
  const b = e.target.closest('[data-act]'); if (b) act(b.dataset.act);
  const c = e.target.closest('[data-color]');
  if (c && slots[selected] && !c.disabled) { slots[selected].color = +c.dataset.color; refreshPot(selected); renderUI(); }
});
function setGraph(on) { $('#graph').hidden = !on; $('#graphToggle').setAttribute('aria-pressed', on); resize(); }
$('#graphToggle').onclick = () => setGraph($('#graph').hidden);
$('#graphClose').onclick = () => setGraph(false);
addEventListener('keydown', (e) => { if (e.key.toLowerCase() === 'g' && !e.metaKey && !e.ctrlKey && !/input|textarea/i.test(e.target.tagName)) setGraph($('#graph').hidden); });

function syncControls() {
  $('#sCozy').setAttribute('aria-pressed', style === 'cozy'); $('#sLab').setAttribute('aria-pressed', style === 'lab');
  $('#tLight').textContent = style === 'cozy' ? 'Day' : 'Light'; $('#tDark').textContent = style === 'cozy' ? 'Night' : 'Dark';
  $('#tLight').setAttribute('aria-pressed', !isDark()); $('#tDark').setAttribute('aria-pressed', isDark());
}
function rebuildAll() { syncControls(); renderLegend(); build(); select(selected); }
function setStyle(s) { style = s; root.dataset.style = s; try { localStorage.setItem('pg-style', s); } catch (e) {} history.replaceState(null, '', '#' + s); rebuildAll(); }
$('#sCozy').onclick = () => setStyle('cozy');
$('#sLab').onclick = () => setStyle('lab');
$('#tLight').onclick = () => { root.dataset.theme = 'light'; rebuildAll(); };
$('#tDark').onclick = () => { root.dataset.theme = 'dark'; rebuildAll(); };
mq.addEventListener('change', () => { if (!root.dataset.theme) rebuildAll(); });

// ---------------------------------------------------------------- loop
function resize() {
  const r = $('#stage').getBoundingClientRect(), W = Math.max(1, r.width), H = Math.max(1, r.height);
  renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W, H);
  camera.aspect = W / H; camera.fov = W / H < 1.1 ? 50 : 32;
  const gw = !$('#graph').hidden && W > 700 ? $('#graph').offsetWidth + 12 : 0;
  if (gw) camera.setViewOffset(W, H, -gw * 0.5, 0, W, H); else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($('#stage'));

setInterval(() => {
  const now = performance.now();
  slots.forEach((a, i) => {
    if (!a) return;
    if (a.status === 'working' && a.autoWaitAt && now > a.autoWaitAt) { a.status = 'waiting'; a.wait = 0; a.autoWaitAt = null; renderUI(); }
    if (a.status === 'waiting') a.wait++;
    refreshPot(i);
  });
  renderSide();
  if (slots[selected] && slots[selected].status === 'waiting') renderTerm();
}, 1000);

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  potObjs.forEach((o, i) => {
    if (!o) return;
    if (o.anim) o.anim(t);
    const a = slots[i];
    if (o.ring.visible && a.status === 'waiting') o.ring.material.emissiveIntensity = pal.glow * (reduced ? 0.8 : 0.35 + 0.65 * Math.abs(Math.sin(t * (stage(a) ? 4 : 2.5))));
    else if (o.ring.visible) o.ring.material.emissiveIntensity = pal.glow * 0.8;
  });
  controls.update();
  composer.render();
  requestAnimationFrame(frame);
}

await Promise.race([document.fonts.ready, new Promise((r) => setTimeout(r, 1500))]);
rebuildAll();
resize();
frame();
</script>
